<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annie — Education</title>
    <meta name="description" content="Annie studies Education and cares about EdTech." />
    <style>
      :root {
        --paper: #faf9f5;
        --ink: #1c1b18;
        --soft: #5b584f;
        --rule: #ddd8c9;
        --line: #e9e4d6;
        --accent: #7a4b2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0 1.25rem 4rem;
        background-color: var(--paper);
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 31px,
          var(--line) 31px,
          var(--line) 32px
        );
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.0625rem;
        line-height: 1.7;
      }

      main {
        max-width: 38rem;
        margin: 0 auto;
        padding-top: 3.5rem;
      }

      .kicker {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--soft);
      }

      h1 {
        margin: 0.35rem 0 0;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .intro {
        margin: 0.75rem 0 0;
        font-size: 1.2rem;
      }

      hr {
        height: 0;
        margin: 2.5rem 0;
        border: 0;
        border-top: 1px solid var(--rule);
      }

      section {
        margin-bottom: 2.75rem;
      }

      h2 {
        margin: 0.4rem 0 0.75rem;
        font-size: 1.6rem;
        font-weight: 400;
      }

      .idea p {
        margin: 0;
        font-size: 1.15rem;
        color: var(--ink);
      }

      .idea::before {
        content: "";
        display: block;
        width: 2.5rem;
        margin-bottom: 1.25rem;
        border-top: 2px solid var(--accent);
      }

      /* Chat */
      .chat form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      label {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.85rem;
        color: var(--soft);
      }

      textarea {
        width: 100%;
        min-height: 5.5rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.75);
        color: inherit;
        font: inherit;
        resize: vertical;
      }

      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      button {
        padding: 0.6rem 1.4rem;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.9rem;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .hint,
      .note {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.8rem;
        color: var(--soft);
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        margin: 0 0 1.25rem;
        padding: 0;
        list-style: none;
      }

      .messages li {
        padding: 0.75rem 1rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        white-space: pre-wrap;
      }

      .messages .me {
        border-color: var(--rule);
        background: rgba(122, 75, 42, 0.06);
      }

      .messages .error {
        border-color: #d8b4a0;
        background: #fbf0ea;
        color: #7a3a1a;
      }

      @media (max-width: 480px) {
        main {
          padding-top: 2.5rem;
        }
        .row {
          flex-direction: column;
          align-items: stretch;
        }
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="kicker">Education</p>
        <h1>Annie</h1>
        <p class="intro">I love study.</p>
      </header>

      <hr />

      <section class="idea">
        <p class="kicker">An idea I care about</p>
        <h2>EdTech</h2>
        <p>it is the future. ai</p>
      </section>

      <hr />

      <section class="chat">
        <p class="kicker">Chat</p>
        <h2>Ask me about EdTech</h2>

        <ul class="messages" id="messages" aria-live="polite"></ul>

        <form id="chat-form">
          <label for="chat-input">Your message</label>
          <textarea
            id="chat-input"
            name="message"
            maxlength="2000"
            placeholder="Type a question…"
            required
          ></textarea>
          <div class="row">
            <p class="hint"><span id="count">0</span>/2000</p>
            <button type="submit" id="send">Send</button>
          </div>
        </form>

        <p class="note">
          The chat only works on the published site, not in the preview.
        </p>
      </section>
    </main>

    <script>
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const send = document.getElementById("send");
      const list = document.getElementById("messages");
      const count = document.getElementById("count");

      const history = [];

      function addMessage(text, kind) {
        const item = document.createElement("li");
        item.textContent = text;
        if (kind) item.className = kind;
        list.appendChild(item);
        item.scrollIntoView({ block: "nearest" });
      }

      input.addEventListener("input", () => {
        count.textContent = input.value.length;
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = input.value.trim();
        if (!text) return;
        if (text.length > 2000) {
          addMessage("That message is a little long — please keep it under 2000 characters.", "error");
          return;
        }

        addMessage(text, "me");
        history.push({ role: "user", content: text });
        input.value = "";
        count.textContent = "0";
        send.disabled = true;

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });

          if (!response.ok) throw new Error("Bad response");

          const data = await response.json();
          const reply = (data && data.reply) || "";
          if (!reply) throw new Error("Empty reply");

          addMessage(reply);
          history.push({ role: "assistant", content: reply });
        } catch (error) {
          addMessage(
            "Sorry, something went wrong. Please try again in a moment.",
            "error"
          );
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
